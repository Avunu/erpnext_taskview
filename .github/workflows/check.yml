name: check

# CI gate for this repo. Auto-merge is only as safe as what runs here, so this is what
# you mark required on `main`.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # package.json's engines.node (>=24), set by the app standards profile.
          node-version: 24
          cache: yarn

      - run: yarn install --frozen-lockfile

      - run: yarn typecheck

      - run: yarn lint

      - run: yarn format:check

      # The desk bundles and the portal. The closing scripts/vite-register.mjs step
      # finds no bench here and skips itself.
      - run: yarn build

      # Frappe renders www/projects.html as a Jinja template and refuses any
      # template containing ".__" (frappe/utils/jinja.py).
      - run: test -f erpnext_taskview/www/projects.html && ! grep -F '.__' erpnext_taskview/www/projects.html
