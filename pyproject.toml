[project]
name = "erpnext_taskview"
authors = [{ name = "Avunu LLC", email = "mail@avu.nu" }]
description = "task workspace for erpnext"
requires-python = ">=3.14"
readme = "README.md"
license = { text = "MIT" }
classifiers = ["License :: OSI Approved :: MIT License"]
dynamic = ["version"]
dependencies = []

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.frappe-nix]
schema = 1
profile = "github:Avunu/frappe-standards-profile/main"
frappe-major = 16
siblings = ["erpnext"]
integration-branch = "main"
# The existing CI gate stays until the reusable CI workflows render ci.yml.
retire-keep = [".github/workflows/check.yml"]

# Until PR B types the desk code against frappe-types: these files still use `any` (most of it for
# frappe's untyped desk API and frappe-ui's untyped components), which the locked
# typescript/no-explicit-any rule refuses. Restore the lock with that PR.
[tool.frappe-nix.js]
locked-rules = false

[[tool.frappe-nix.js.oxlint.overrides]]
files = [
	"erpnext_taskview/public/js/TaskView.vue",
	"erpnext_taskview/public/js/components/AssignTo.vue",
	"erpnext_taskview/public/js/components/Task.vue",
	"erpnext_taskview/public/js/taskview.entry.ts",
	"erpnext_taskview/public/js/timerDialog.ts",
	"erpnext_taskview/public/js/timerStore.ts",
	"erpnext_taskview/public/js/types.ts",
	"erpnext_taskview/public/js/types/frappe.d.ts",
	"portal/src/types/frappe-ui-editor.d.ts",
	"portal/src/types/frappe-ui.d.ts",
	"vite.config.ts",
]
rules = { "typescript/no-explicit-any" = "off" }

# Stylesheet imports in the SFCs and the portal entry, and the dayjs plugin types the frappe-ui
# shim augments: side-effect imports by design.
[[tool.frappe-nix.js.oxlint.overrides]]
files = [
	"erpnext_taskview/public/js/TaskView.vue",
	"erpnext_taskview/public/js/components/PinnedView.vue",
	"erpnext_taskview/public/js/components/Task.vue",
	"erpnext_taskview/public/js/components/TimerWidget.vue",
	"portal/src/main.ts",
	"portal/src/types/frappe-ui.d.ts",
]
rules = { "import/no-unassigned-import" = "off" }

# `df.onchange` on a frappe dialog field is frappe's callback, not a DOM event handler.
[[tool.frappe-nix.js.oxlint.overrides]]
files = ["erpnext_taskview/public/js/components/Task.vue", "erpnext_taskview/public/js/timerDialog.ts"]
rules = { "unicorn/prefer-add-event-listener" = "off" }

# The constructor only calls super, but the base is cast to `any`, so it is what gives
# `new TaskViewSortSelector(opts)` its parameter for the type checker.
[[tool.frappe-nix.js.oxlint.overrides]]
files = ["erpnext_taskview/public/js/taskview.entry.ts"]
rules = { "no-useless-constructor" = "off" }

# The hand-written frappe globals: `export {}` makes the file a module for its `declare global`.
# PR B replaces the file with frappe-types.
[[tool.frappe-nix.js.oxlint.overrides]]
files = ["erpnext_taskview/public/js/types/frappe.d.ts"]
rules = { "unicorn/require-module-specifiers" = "off" }

[tool.frappe-nix.dev-shell]
frappe-nix-url = "github:Avunu/frappe-nix/e95f67f97de1322c89df9ffbc9218c31d4ca83ba"

[[tool.frappe-nix.typescript.spa]]
root = "."
include = ["erpnext_taskview/public/js/**"]
tsconfig = "tsconfig.json"
check = "node scripts/vue-tsc.cjs --noEmit -p tsconfig.json"

[[tool.frappe-nix.typescript.spa]]
root = "portal"
include = ["portal/src/**"]
tsconfig = "portal/tsconfig.json"
check = "node scripts/vue-tsc.cjs --noEmit -p portal/tsconfig.json"

# These dependencies are only installed when developer mode is enabled
[tool.bench.dev-dependencies]
# package_name = "~=1.1.0"

[tool.bench.frappe-dependencies]
frappe = ">=16.0.0,<17.0.0"

[tool.ssort]
# Skip sorting within TYPE_CHECKING blocks
skip = ["TYPE_CHECKING"]

[tool.ruff]
line-length = 110
target-version = "py314"

[tool.ruff.lint]
select = ["F", "E", "W", "I", "UP", "B", "RUF", "SIM", "C4", "PIE", "PERF", "T20"]
ignore = [
	"E501", # line too long
	"W191", # indentation contains tabs
]
typing-modules = ["frappe.types.DF"]

[tool.ruff.format]
quote-style = "double"
indent-style = "tab"
docstring-code-format = true

[tool.ty.environment]
python-version = "3.14"

[tool.ty.src]
include = ["erpnext_taskview"]

[tool.ty.terminal]
error-on-warning = true

[tool.coverage.run]
omit = ["*/tests/*", "*/test_*.py", "*/patches/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true
precision = 1
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "@(abc\\.)?abstractmethod"]
fail_under = 0

[tool.vulture]
exclude = [".venv/", "node_modules/", ".frappe-nix/", ".dev-dist/"]

[tool.test_utils.static-analysis]
whitelist = ["frappe.*", "erpnext.*"]
