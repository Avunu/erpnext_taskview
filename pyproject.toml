[project]
name = "erpnext_taskview"
authors = [{ name = "Avunu LLC", email = "mail@avu.nu" }]
description = "task workspace for erpnext"
requires-python = ">=3.14"
readme = "README.md"
license = { text = "MIT" }
classifiers = ["License :: OSI Approved :: MIT License"]
dynamic = ["version"]
# frappe and erpnext come from the bench ([tool.bench.frappe-dependencies]); these are the
# libraries the app imports itself, within the ranges frappe v16 pins.
dependencies = ["beautifulsoup4>=4.13,<5", "nh3>=0.3,<1", "pydantic>=2.12,<3"]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.frappe-nix]
schema = 1
profile = "github:Avunu/frappe-standards-profile/main"
frappe-major = 16
siblings = ["erpnext"]
integration-branch = "main"

[tool.frappe-nix.dev-shell]
frappe-nix-url = "github:Avunu/frappe-nix/a216ce95ce051fe0bc5b95f112fcb85529910ede"

# docs.yml calls Avunu/site-docs' shared check. Its pin gets its own needs-review Dependabot
# group (a person reads every bump) and skips the cooldown, as before the shared gates.
[tool.frappe-nix.docs-site]
enable = true
action-patterns = ["Avunu/site-docs*"]
cooldown-exclude-actions = ["Avunu/site-docs"]

# Stylesheet imports are side-effect imports by nature: Vite pulls the CSS into the
# bundle in import order. Exempt exactly the modules that import a stylesheet, and
# nothing else, from import/no-unassigned-import.
[[tool.frappe-nix.js.oxlint.overrides]]
files = [
	"erpnext_taskview/public/js/TaskView.vue",
	"erpnext_taskview/public/js/components/PinnedView.vue",
	"erpnext_taskview/public/js/components/Task.vue",
	"erpnext_taskview/public/js/components/TimerWidget.vue",
	"portal/src/main.ts",
]
rules = { "import/no-unassigned-import" = "off" }

[[tool.frappe-nix.typescript.spa]]
root = "."
include = ["erpnext_taskview/public/js/**"]
tsconfig = "tsconfig.json"
check = "node scripts/vue-tsc.cjs --noEmit -p tsconfig.json"

[[tool.frappe-nix.typescript.spa]]
root = "portal"
include = ["portal/src/**"]
tsconfig = "portal/tsconfig.json"
check = "node scripts/vue-tsc.cjs --noEmit -p portal/tsconfig.json"

# These dependencies are only installed when developer mode is enabled
[tool.bench.dev-dependencies]
# package_name = "~=1.1.0"

[tool.bench.frappe-dependencies]
frappe = ">=16.0.0,<17.0.0"
erpnext = ">=16.0.0,<17.0.0"

[tool.ssort]
# Skip sorting within TYPE_CHECKING blocks
skip = ["TYPE_CHECKING"]

[tool.ruff]
line-length = 110
target-version = "py314"

[tool.ruff.lint]
select = ["F", "E", "W", "I", "UP", "B", "RUF", "SIM", "C4", "PIE", "PERF", "T20"]
ignore = [
	"E501", # line too long
	"W191", # indentation contains tabs
]
typing-modules = ["frappe.types.DF"]

[tool.ruff.format]
quote-style = "double"
indent-style = "tab"
docstring-code-format = true

[tool.ty.environment]
python-version = "3.14"

[tool.ty.src]
include = ["erpnext_taskview"]

[tool.ty.terminal]
error-on-warning = true

[tool.coverage.run]
omit = ["*/tests/*", "*/test_*.py", "*/patches/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true
precision = 1
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "@(abc\\.)?abstractmethod"]
fail_under = 80

[tool.vulture]
exclude = [".venv/", "node_modules/", ".frappe-nix/", ".dev-dist/", ".devenv/", ".direnv/"]

[tool.test_utils.static-analysis]
whitelist = ["frappe.*", "erpnext.*"]
